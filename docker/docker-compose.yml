services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: shield
      POSTGRES_DB: shield
    ports:
      - "5433:5432"   # host 5433 (5432 may be taken by a local Postgres)
    volumes:
      - shield_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: llm-proxy:dev
    ports:
      - "8080:8080"
    env_file:
      - ../.env          # never committed — see .env.example
    volumes:
      - ../logs:/app/logs   # audit log persists outside the container
    read_only: true
    tmpfs:
      - /tmp              # uvicorn needs a writable /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  shield_pgdata:
