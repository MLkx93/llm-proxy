services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: shield
      POSTGRES_PASSWORD: shield
      POSTGRES_DB: shield
    ports:
      - "5433:5432"   # host 5433 (5432 may be taken by a local Postgres)
    volumes:
      - shield_pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shield"]
      interval: 10s
      timeout: 5s
      retries: 5

  proxy:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: llm-proxy:dev
    ports:
      - "8080:8080"
    env_file:
      - ../.env          # never committed — see .env.example
    environment:
      # Override for the docker network — talk to the postgres container by
      # service name and its in-network port, not the host-mapped 5433.
      DATABASE_URL: postgresql+asyncpg://shield:shield@postgres:5432/shield
    volumes:
      - ../logs:/app/logs   # audit log persists outside the container
    read_only: true
    tmpfs:
      - /tmp              # uvicorn needs a writable /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  webui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.webui
    image: llm-proxy-webui:dev
    ports:
      - "8000:8000"
    env_file:
      - ../.env          # never committed — see .env.example
    environment:
      # Overrides for the docker network — talk to sibling containers by
      # service name, not localhost.
      DATABASE_URL: postgresql+asyncpg://shield:shield@postgres:5432/shield
      PROXY_BASE_URL: http://proxy:8080
    volumes:
      - ../logs:/app/logs
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: llm-proxy-frontend:dev
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      webui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  shield_pgdata:
